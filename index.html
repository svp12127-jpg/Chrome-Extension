<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>New Tab</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="clock">19:25</div>
        <div id="date">Thursday, May 21</div>
        <div id="greeting">Good evening!</div>
        <div id="quote"></div>
        <div id="weather"></div>
        <div id="countdown"></div>
        <div id="to-do">
            <input type="text" id="todo-input" placeholder="Add a task...">
            <button id="todo-add">Add</button>
            <ul id="todo-list"></ul>
        </div>
        <div id="calendar"></div>
        <script src="script.js"></script>
    </body>
</html>
